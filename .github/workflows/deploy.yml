name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 이 줄을 추가하여 배포 권한을 부여합니다.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
 # Node 24 사용 강제 설정

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 최신 v4 버전 사용 (Node 20/24 지원)

      - name: Set up Node.js
        uses: actions/setup-node@v4 # 최신 v4 버전 사용
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4 # 최신 v4 버전 사용
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
